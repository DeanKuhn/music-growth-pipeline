
name: 'music_growth'
version: '1.0.0'
profile: 'music_growth'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First weekly snapshot of the stable 21.7k population (per-artist series).
  series_start_date: '2026-05-10'
  # First week every current artist has; cross-artist growth comparisons start here.
  panel_start_date: '2026-08-09'

models:
  music_growth:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +grants:
        select: ['app_readonly']
    api:
      +materialized: table
      +grants:
        select: ['app_readonly']

on-run-start: "set lock_timeout = '5s'"