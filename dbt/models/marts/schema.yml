version: 2

models:
  - name: listener_growth
    description: >
      One row per artist per week with the change from the previous snapshot.
      Drops the earliest global snapshot date.
    columns:
      - name: artist_id
        description: FK to stg_artists.
      - name: snapshot_date
        description: Week of observation.
      - name: listeners
        description: Cumulative listeners this week.
      - name: previous_listeners
        description: Listeners at the artist's previous snapshot. Null in their first row.
      - name: listener_delta
        description: listeners - previous_listeners.
      - name: listener_pct_change
        description: Week-over-week percent change.

  - name: artist_growth_panel
    description: >
      One row per artist with a snapshot in every week since panel_start_date.
      Equal-window growth for cross-artist comparisons — use this, not
      artist_growth_summary (see Issue #9 in docs/findings.md).
    columns:
      - name: artist_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: start_listeners
        description: Listeners at window_start.
        tests:
          - not_null
      - name: end_listeners
        description: Listeners at window_end.
        tests:
          - not_null
      - name: pct_growth
        description: Total percent growth across the window.
        tests:
          - not_null
      - name: size_quintile
        description: ntile(5) on start_listeners, 1 (smallest) to 5.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: window_start
        description: First snapshot date in the window.
      - name: window_end
        description: Latest snapshot date. Advances weekly.
      - name: n_weeks
        description: Snapshots in the window. Every row has all of them.

  - name: artist_growth_summary
    description: One row per artist. First-to-last listener growth over the listener_growth window.
    columns:
      - name: artist_id
        description: Primary key.
      - name: artist_name
        description: Raw Last.fm name.
      - name: size_band
        description: From int_artist_base.
      - name: size_band_sort
        description: Sort key for size_band.
      - name: min_page
        description: Best (lowest) chart page. Null if never charted.
      - name: starting_count
        description: Listeners at the first observation in the window.
      - name: ending_count
        description: Listeners at the last observation in the window.
      - name: total_listener_delta
        description: ending_count - starting_count.
      - name: total_pct_growth
        description: Total percent growth across the window.
      - name: average_listener_pct
        description: Mean of weekly listener_pct_change.
      - name: weeks_tracked
        description: Weeks with a listener_growth row.

  - name: artist_chart_position
    description: One row per artist, left-joined so uncharted artists still appear.
    columns:
      - name: artist_id
        description: Primary key.
      - name: artist_name
        description: Raw Last.fm name.
      - name: mbid
        description: MusicBrainz ID. Nullable.
      - name: min_page
        description: Best (lowest) chart page. Null if never charted.
      - name: global_rank
        description: Best overall position, (page - 1) * 5 + rank. Null if never charted.

  - name: artist_similarity_network
    description: >
      Similarity pairs where both artists are in the database, tagged by whether
      they share a size band.
    columns:
      - name: artist_id
        description: Queried artist.
      - name: artist_name
        description: Queried artist's raw name.
      - name: artist_size_band
        description: Queried artist's size band.
      - name: similar_artist_id
        description: Similar artist.
      - name: similar_name
        description: Similar artist's name.
      - name: similar_artist_size_band
        description: Similar artist's size band.
      - name: similarity_score
        description: Last.fm match score, 0-1.
      - name: pair_type
        description: same_band or cross_band.

  - name: genre_stats
    description: One row per genre. Size and engagement at the latest snapshot.
    columns:
      - name: genre_id
        description: Primary key.
      - name: genre
        description: Genre tag name.
      - name: artist_count
        description: Distinct artists tagged with the genre.
      - name: avg_listeners
        description: Mean latest listeners.
      - name: avg_plays_per_listener
        description: Mean of playcount / listeners.
      - name: large_count
        description: Artists with 250k+ starting listeners.
      - name: small_count
        description: Artists under 250k starting listeners.

  - name: genre_growth
    description: >
      One row per genre. Growth aggregates from artist_growth_summary; only
      artists with 6+ weeks, only genres with 50+ artists.
    columns:
      - name: genre
        description: Primary key.
      - name: artist_count
        description: Qualifying artists in the genre.
      - name: avg_total_pct_growth
        description: Mean total_pct_growth.
      - name: median_total_pct_growth
        description: Median total_pct_growth.
      - name: avg_weekly_pct_change
        description: Mean of average_listener_pct.
      - name: avg_listeners
        description: Mean ending_count.

  - name: weekly_growth_by_size_band
    description: One row per size band per week. Summed listeners and week-over-week change.
    columns:
      - name: snapshot_date
        description: Week of observation.
      - name: size_band
        description: From int_artist_base.
      - name: total_listeners
        description: Sum of listeners across the band.
      - name: artist_count
        description: Artists observed in the band this week.
      - name: previous_total_listeners
        description: total_listeners from the prior week.
      - name: listener_delta
        description: total_listeners - previous_total_listeners.
      - name: listener_pct_change
        description: Week-over-week percent change of the band total.
