version: 2

models:
  - name: api_artist_timeseries
    description: >
      One row per artist per complete weekly snapshot. Serving model for the
      artist chart endpoint and the input to api_cohort_weekly. Partial
      snapshot weeks are excluded — see the model for why.
    columns:
      - name: artist_id
        description: FK to artists.
        tests:
          - not_null
      - name: snapshot_date
        description: Week of observation. Only complete weeks appear here.
        tests:
          - not_null
      - name: week_number
        description: 1-based position of this week within the artist's own series.
        tests:
          - not_null
      - name: listeners
        description: Cumulative all-time Last.fm listeners. Can only increase.
        tests:
          - not_null
      - name: listener_delta
        description: Listeners gained since the previous week. Null in week 1.
      - name: listener_pct_change
        description: Week-over-week percent change. Null in week 1.
      - name: listeners_indexed
        description: >
          Listeners rebased to 100 at the artist's first complete week.
          Always 100.00 when week_number = 1.
        tests:
          - not_null

  - name: api_artist_profile
    description: >
      One row per artist. Backs GET /api/artists/[slug]. Growth figures are
      derived from api_artist_timeseries so the profile always agrees with the
      chart on the same page.
    columns:
      - name: artist_id
        tests:
          - unique
          - not_null
      - name: slug
        description: URL identifier, "<artist_id>-<normalised-name>".
        tests:
          - unique
          - not_null
      - name: name_norm
        description: lower(unaccent(btrim(name))). Search/match key.
        tests:
          - not_null
      - name: display_name
        description: >
          Name as published. '[redacted]' when the artist fails the profanity
          filter — the raw name is not exposed by any api model.
        tests:
          - not_null
      - name: is_display_safe
        description: False when the name matches PROFANITY_PATTERN.
        tests:
          - not_null
      - name: size_band
        description: Listener band. The sole size classification — see artist_chart_position for raw chart-depth stats (min_page, global_rank), which are not used for classification.
        tests:
          - not_null
          - accepted_values:
              values: ['<10k', '10k-50k', '50k-100k', '100k-250k',
                       '250k-500k', '500k-1M', '1M+']
      - name: genres
        description: text[] ordered by rank_in_genre. Empty array, never null.
        tests:
          - not_null
      - name: total_pct_growth
        description: Null when the artist has fewer than 2 complete weeks.
      - name: pct_rank_in_size_band
        description: >
          percent_rank of total_pct_growth within size_band. Null when growth
          is null.
      - name: pct_rank_in_genre
        description: Null when the artist has no genre rows.

  - name: api_artist_search
    description: >
      One row per searchable artist. Backs GET /api/search — matched on
      name_norm via pg_trgm (typos) or a text_pattern_ops prefix scan (queries
      too short to produce trigrams), ordered by latest_listeners. Artists
      failing the profanity filter are excluded, so nothing unsafe can
      autocomplete.
    columns:
      - name: artist_id
        tests:
          - unique
          - not_null
      - name: slug
        description: Matches api_artist_profile.slug — every hit resolves.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('api_artist_profile')
              field: slug
      - name: display_name
        description: >
          Always the real name here: unsafe artists are filtered out of this
          model rather than redacted.
        tests:
          - not_null
      - name: name_norm
        description: lower(unaccent(btrim(name))). The indexed match column.
        tests:
          - not_null
      - name: latest_listeners
        description: Most recent snapshot's listener count. Ranking key.
        tests:
          - not_null
      - name: size_band
        tests:
          - not_null

  - name: api_cohort_weekly
    description: >
      One row per cohort per week. Backs the comparison line on an artist page
      (GET /api/artists/[slug]/compare), joined against api_artist_timeseries
      on snapshot_date. Cohorts smaller than min_cohort_size (default 20) are
      dropped. Grain is asserted by tests/assert_api_cohort_weekly_grain.sql.
    columns:
      - name: cohort_type
        description: >
          size_band | genre | all. Deliberately no 'tier' — unranked is an
          observation gap, not a size band.
        tests:
          - not_null
          - accepted_values:
              values: ['size_band', 'genre', 'all']
      - name: cohort_key
        description: The band name, genre name, or the literal 'all'.
        tests:
          - not_null
      - name: week_number
        description: >
          1-based week within this cohort's own series, not the artist's.
        tests:
          - not_null
      - name: artist_count
        description: Artists contributing to this cohort-week.
        tests:
          - not_null
      - name: median_indexed
        description: >
          Median listeners_indexed — every artist rebased to 100 at their
          first week, so cohorts of very different size are comparable.
        tests:
          - not_null
      - name: p25_indexed
        tests:
          - not_null
      - name: p75_indexed
        tests:
          - not_null
      - name: median_pct_change
        description: >
          Median week-over-week percent change (median of the changes, not the
          change in the median). Null in week 1.

  - name: api_artist_similar
    description: >
      Up to max_similar_per_artist (20) neighbours per artist, each with its
      own growth. Backs GET /api/artists/[slug]/similar. Edges are
      symmetrised — the raw table is one-directional and would leave 7,766
      artists with an empty table.
    columns:
      - name: artist_id
        description: The artist whose page this row appears on.
        tests:
          - not_null
      - name: similar_artist_id
        tests:
          - not_null
          - relationships:
              to: ref('api_artist_profile')
              field: artist_id
      - name: slug
        description: The neighbour's slug. Always resolves to a profile.
        tests:
          - not_null
      - name: display_name
        description: >
          The neighbour's real name — unsafe artists are excluded from this
          model, not redacted.
        tests:
          - not_null
      - name: similarity_score
        description: Last.fm match score, 0-1. Higher of the two directions.
        tests:
          - not_null
      - name: rank
        description: 1-based, by similarity_score then listeners.
        tests:
          - not_null
      - name: total_pct_growth
        description: The neighbour's own growth over the window.

  - name: api_leaderboard
    description: >
      Precomputed top-N (leaderboard_size, 50) for three metrics, scoped
      globally and per size_band. Backs GET /api/leaderboards. Excludes
      artists under min_leaderboard_listeners and artists without the full
      window — see the model for why.
    columns:
      - name: slice_type
        tests:
          - not_null
          - accepted_values:
              values: ['fastest_growing_pct', 'biggest_listener_gain',
                       'most_listeners']
      - name: slice_key
        description: The literal 'all', or a size_band value.
        tests:
          - not_null
      - name: rank
        description: 1-based within (slice_type, slice_key).
        tests:
          - not_null
      - name: metric_value
        description: The value this slice is ranked on.
        tests:
          - not_null
      - name: slug
        tests:
          - not_null
          - relationships:
              to: ref('api_artist_profile')
              field: slug
      - name: display_name
        tests:
          - not_null

  - name: api_genres
    description: >
      One row per genre. Backs GET /api/genres. Left-joins genre_growth onto
      genre_stats, so growth columns are null for genres below
      genre_growth's weeks_tracked >= 6 / >= 50 qualifying-artist thresholds
      rather than the genre disappearing from the endpoint.
    columns:
      - name: genre_id
        tests:
          - unique
          - not_null
      - name: genre
        tests:
          - unique
          - not_null
      - name: artist_count
        description: Count from genre_stats — every genre with >=1 artist.
        tests:
          - not_null
      - name: avg_listeners
        description: >
          Latest-snapshot average across all artists in the genre. Distinct
          from growth_avg_weekly_pct_change's population (see model note).
        tests:
          - not_null
      - name: avg_total_pct_growth
        description: Null when the genre is below genre_growth's thresholds.
      - name: median_total_pct_growth
        description: Null when the genre is below genre_growth's thresholds.

  - name: api_pipeline_health
    description: >
      Exactly one row. Backs GET /api/stats and the how-it-works page.
      Freshness is measured from the latest snapshot_date, not the dbt run, so
      a successful rebuild over failed ingestion still shows as stale.
    tests:
      - assert_single_row
    columns:
      - name: artists_total
        tests:
          - not_null
      - name: latest_snapshot_date
        tests:
          - not_null
      - name: days_since_snapshot
        description: '> 7 means a weekly run was missed.'
        tests:
          - not_null
      - name: weeks_in_series
        description: >
          Distinct weeks in api_artist_timeseries — fewer than snapshot_dates,
          which counts the two partial pre-window dates too.
        tests:
          - not_null
