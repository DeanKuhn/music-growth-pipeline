<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist — music growth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen">

  <header class="border-b border-gray-800 px-6 py-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="/" class="text-lg font-semibold">music growth</a>
      <nav class="flex gap-6 text-sm text-gray-400">
        <a href="/" class="hover:text-gray-100">Home</a>
        <a href="/leaderboards" class="hover:text-gray-100">Leaderboards</a>
        <a href="/genres" class="hover:text-gray-100">Genres</a>
        <a href="/how-it-works" class="hover:text-gray-100">How it works</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <div id="artist-header"></div>
    <div id="artist-percentile" class="mt-4 text-gray-400"></div>
    <div id="artist-stats" class="grid grid-cols-4 gap-4 mt-8"></div>
    <div class="border border-gray-800 rounded-lg bg-gray-900/50 px-4 py-4 mt-10">
      <canvas id="artist-chart" height="100"></canvas>
    </div>
    <div id="similar-section" class="border border-gray-800 rounded-lg bg-gray-900/50 px-4 py-4 mt-10 hidden"></div>
  </main>

  <footer class="border-t border-gray-800 px-6 py-4 mt-auto">
    <div class="max-w-4xl mx-auto text-sm text-gray-500">
      Data from Last.fm · Updated weekly
    </div>
  </footer>

  <script src="index.js"></script>
</body>

</html>
