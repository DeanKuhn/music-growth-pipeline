<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deanslist.dev</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 min-h-screen">

  <header class="border-b border-gray-200 px-6 py-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="/" class="text-lg font-semibold">deanslist.dev</a>
      <nav class="flex gap-6 text-sm text-gray-500">
        <a href="/" class="text-gray-900">Home</a>
        <a href="/leaderboards.html" class="hover:text-gray-900">Leaderboards</a>
        <a href="/genres.html" class="hover:text-gray-900">Genres</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-2">Music Growth Tracker</h1>
    <p class="text-gray-500 mb-8">See how independent artists grow on Last.fm — weekly listener snapshots, genre breakdowns, and cohort comparisons.</p>

    <div class="relative mb-12">
      <input
        id="search"
        type="text"
        placeholder="Search artists..."
        class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
      <div id="search-results" class="absolute z-10 w-full bg-white border border-gray-200 rounded-lg mt-1 shadow-lg hidden"></div>
    </div>

    <div id="stats" class="grid grid-cols-3 gap-6">
      <!-- Populated by JS -->
    </div>
  </main>

  <footer class="border-t border-gray-200 px-6 py-4 mt-auto">
    <div class="max-w-4xl mx-auto text-sm text-gray-400">
      Data from Last.fm · Updated weekly
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
