<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Growth</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen">

  <header class="border-b border-gray-800 px-6 py-4">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
      <a href="/" class="text-lg font-semibold">music growth</a>
      <nav class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-400">
        <a href="/" class="text-gray-100">Home</a>
        <a href="/leaderboards" class="hover:text-gray-100">Leaderboards</a>
        <a href="/genres" class="hover:text-gray-100">Genres</a>
        <a href="/how-it-works" class="hover:text-gray-100">How it works</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-2">Music Growth Tracker</h1>
    <p class="text-gray-400 mb-8">See how independent artists grow on Last.fm. Search one and see it compared to its genre, size band, and artists like it.</p>

    <div class="relative mb-12">
      <input id="search" type="text" placeholder="Search artists..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-base text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-sky-600 focus:border-transparent">
      <div id="search-results" class="absolute z-10 w-full bg-gray-900 border border-gray-700 rounded-lg mt-1 shadow-lg hidden"></div>
    </div>

    <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Populated by JS -->
    </div>
  </main>

  <footer class="border-t border-gray-800 px-6 py-4 mt-auto">
    <div class="max-w-4xl mx-auto text-sm text-gray-500">
      Data from Last.fm · Updated weekly
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
